:root{--ink:#22252B;--cobalt:#2B4FE0;--mute:#75726B;--rule:#CDC9C2;
  --sans:'Trebuchet MS',Verdana,sans-serif;--serif:'Spectral',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:#F7F3E8;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
@supports (height:100dvh){body{min-height:100dvh}}

.top{display:flex;justify-content:space-between;align-items:center;padding:20px 30px;gap:14px;flex-wrap:wrap;position:relative;z-index:50;background:#F7F3E8}
.brand{font-size:19px;font-weight:600;text-decoration:none;color:var(--ink)}
.ac{color:var(--cobalt)}
.nav{display:flex;gap:20px}
.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.nav a:hover{color:var(--ink)}
.nav a.sub{color:var(--cobalt);border:1px solid var(--cobalt);border-radius:4px;padding:6px 12px;margin:-6px 0}
.nav a.sub:hover{background:var(--cobalt);color:#fff}


.hero{display:flex;align-items:center;justify-content:center;gap:min(5vw,64px);
  max-width:1180px;margin:0 auto;padding:4vh 30px 8vh;min-height:calc(100vh - 156px)}
@supports (height:100dvh){.hero{min-height:calc(100dvh - 156px)}}

.col{flex:1 1 0;max-width:520px}
.issue{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cobalt);margin:0 0 18px}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.4vw,54px);line-height:1.1;margin:0}
.hook{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.7vw,21px);line-height:1.5;color:var(--mute);margin:20px 0 0}
.meta{display:flex;gap:18px;margin:26px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.read{display:inline-block;margin:32px 0 0;padding:13px 26px;background:var(--cobalt);color:#fff;
  text-decoration:none;border-radius:6px;font-size:13px;letter-spacing:.06em}
.read:hover{background:#2340BC}
.swap{display:inline-block;margin:18px 0 0 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);background:none;border:0;cursor:pointer;font-family:inherit;text-decoration:underline}

.stack{position:relative;width:min(46vw,560px);aspect-ratio:340/118;flex:0 0 auto;perspective:900px;transform:rotate(-6deg)}
.pg{--t:0;--r:-6deg;position:absolute;left:0;right:0;bottom:0;height:72%;transform-origin:50% 7%;-webkit-transform-origin:50% 7%;backface-visibility:visible;-webkit-backface-visibility:visible;
  transform:translateY(calc(var(--i) * -3px)) translateX(calc(var(--i) * 1.5px)) rotate(calc(var(--i) * -0.45deg));
  opacity:calc(1 - var(--i) * 0.012)}

<script>
(function(){
  var stack=document.getElementById('stack'); if(!stack) return;
  var read=[];
  var base=[].slice.call(stack.children);
  function resetStack(){
    base.forEach(function(p,i){
      p.classList.remove('turned');
      p.style.removeProperty('--t'); p.style.removeProperty('--r');
      p.style.setProperty('--i',i); p.style.zIndex=String(base.length-i);
    });
  }
  function turn(){
    var unread=[].slice.call(stack.children).filter(function(p){return !p.classList.contains('turned')});
    if(unread.length<=1){
      read=[]; resetStack(); return;
    }
    var top=unread[0];
    top.style.setProperty('--t', read.length);
    top.style.setProperty('--r', (-6 - read.length*0.8)+'deg');
    top.style.zIndex=String(200+read.length);
    top.classList.add('turned'); read.push(top);
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(function tick(){ turn(); setTimeout(tick, 3400); }, 1400);
  }

  // what the same page looks like with a different story in it
  var issues=[
    ['Issue one — August','The Elephant of Sindhupura','The hardest victory to survive is your own.','Fiction','Six minutes'],
    ['Issue two — September','The Salt Officer','He counted every grain that left the port, and one that did not.','Fiction','Nine minutes'],
    ['Issue three — October','The Weaver of Kanchi','She wove the king\'s defeat into his coronation cloth.','Fiction','Five minutes'],
    ['Issue four — November','What the Copperplates Say','A land grant, a forged seal, and four centuries of argument.','History','Eleven minutes']
  ];
  var n=0, ids=['issue','title','hook','kind','len'];
  document.getElementById('swap').addEventListener('click',function(){
    n=(n+1)%issues.length;
    var live = (n===0);
    var rd=document.getElementById('read'), tl=document.getElementById('title');
    rd.href = live ? 'leaf-and-ink-issue-01.html' : '#';
    tl.href = live ? 'leaf-and-ink-issue-01.html' : '#';
    rd.textContent = live ? 'Read the story' : 'Coming soon';
    rd.style.background = live ? '' : '#9A968F';
    ids.forEach(function(id,i){
      var el=document.getElementById(id);
      el.style.transition='opacity .25s'; el.style.opacity='0';
      setTimeout(function(){ el.textContent=issues[n][i]; el.style.opacity='1'; },250);
    });
  });
})();
</script>
